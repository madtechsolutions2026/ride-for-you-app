# Publishes an over-the-air update to installed APKs whenever mobile code
# lands on main. No rebuild, no reinstall — the app picks it up on next launch.
#
# Requires one repository secret:
#   EXPO_TOKEN  -> expo.dev > Account Settings > Access Tokens
#
# NOTE: OTA updates ship JS, styles and assets only. Adding a NEW NATIVE
# dependency still needs a fresh build:
#   eas build -p android --profile preview
name: EAS Update

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Publish update
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
